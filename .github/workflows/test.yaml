name: "(Test) Templates"
on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            node:
              - 'src/node/**'
              - 'test/node/**'
            node-image:
              - 'src/node-image/**'
              - 'test/node-image/**'
              # node-image consumes an image built from the node template's
              # build context, so a Dockerfile change must retest it too.
              - 'src/node/.devcontainer/**'

  test:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.templates != '[]' && needs.detect-changes.outputs.templates != '' }}
    runs-on: ubuntu-latest
    # Deliberately NOT continue-on-error: a green tick over a failed smoke test
    # is worse than no tick at all.
    strategy:
      matrix:
        templates: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    env:
      # Indirected out of the `run:` blocks below rather than interpolated
      # directly, so a matrix value can never be spliced into the shell.
      TEMPLATE_ID: ${{ matrix.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli@0.88.0

      - name: "Generating tests for '${{ matrix.templates }}'"
        run: echo "${TEMPLATE_ID}"

      - name: Configure template
        run: |
          set -e
          cd "src/${TEMPLATE_ID}"

          # Configure templates only if `devcontainer-template.json` contains the `options` property.
          optionProp=( $(jq -r '.options' devcontainer-template.json) )

          if [ "${optionProp}" != "" ] && [ "${optionProp}" != "null" ] ; then
            options=( $(jq -r '.options | keys[]' devcontainer-template.json) )

            if [ "${options[0]}" != "" ] && [ "${options[0]}" != "null" ] ; then
              echo "(!) Configuring template options within 'src/${TEMPLATE_ID}' folder"
              for option in "${options[@]}"
              do
                option_key="\${templateOption:$option}"
                option_value=$(jq -r ".options | .${option} | .default" devcontainer-template.json)

                if [ "${option_value}" = "" ] || [ "${option_value}" = "null" ] ; then
                  echo "Template '${TEMPLATE_ID}' is missing a default value for option '${option}'"
                  exit 1
                fi

                echo "(!) Replacing '${option_key}' with '${option_value}'"
                option_value_escaped=$(sed -e 's/[]\/$*.^[]/\\&/g' <<<"${option_value}")
                find ./ -type f -print0 | xargs -0 sed -i "s/${option_key}/${option_value_escaped}/g"
              done
            fi
          fi

      # Templates that reference a prebuilt ghcr.io/andykenward/devcontainer-images
      # image are tested against an image built from THIS pull request, not the
      # published one — which may not exist yet, and is stale the moment a PR
      # touches the Dockerfile. The devcontainer CLI runs `docker inspect` before
      # `docker pull`, so tagging the local build with the exact reference the
      # template asks for makes `devcontainer up` resolve it locally and never
      # reach the registry.
      #
      # This also makes the smoke test cover the metadata baking end-to-end,
      # through the same `devcontainer build` code path release.yaml publishes
      # with. It is what catches "the metadata label no longer carries
      # remoteUser" before it ships.
      - name: Build and locally tag the prebuilt image
        run: |
          set -euo pipefail
          config="src/${TEMPLATE_ID}/.devcontainer/devcontainer.json"

          # grep, not the `sed 's|//.*||'` JSONC strip used below — that also
          # mangles https:// inside string values.
          ref="$(grep -oE '"image"[[:space:]]*:[[:space:]]*"ghcr\.io/andykenward/devcontainer-images/[^"]+"' "${config}" \
                 | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"

          if [ -z "${ref}" ]; then
            echo "Template '${TEMPLATE_ID}' does not reference a prebuilt image; nothing to do."
            exit 0
          fi

          echo "Template image reference: ${ref}"
          devcontainer build --workspace-folder src/node --image-name "${ref}"

      - name: Run Smoke Test
        run: |
          template_id="${TEMPLATE_ID}"
          src_dir="test/${template_id}"

          if [ ! -d "$(pwd)/${src_dir}" ] ; then
            echo "Template '${TEMPLATE_ID}' is missing a test folder"
            exit 1
          fi

          dest_dir="src/${template_id}/test-project"
          mkdir -p ${dest_dir}
          shopt -s dotglob
          cp -Rp ${src_dir}/* ${dest_dir}

          echo "Building dev container"
          id_label="test-container=${template_id}"
          devcontainer up --id-label ${id_label} --workspace-folder "src/${template_id}/"

          # Fake out existence of extensions, VS Code Server to validate extensions
          echo "(*) Stubbing out extensions and VS Code Server..."

          # Configuring path for 'devcontainer.json'
          dev_container_relative_path="src/${template_id}"
          dev_container_json_name=".devcontainer.json"

          if [ -d "$(pwd)/${dev_container_relative_path}/.devcontainer" ] ; then
            dev_container_relative_path="${dev_container_relative_path}/.devcontainer"
            dev_container_json_name="devcontainer.json"
          fi

          mkdir -p "/tmp/${dev_container_relative_path}"
          cp -f "$(pwd)/${dev_container_relative_path}/${dev_container_json_name}" "/tmp/${dev_container_relative_path}/"
          dev_container_tmp="/tmp/${dev_container_relative_path}/${dev_container_json_name}"
          sed -i'.bak' -e "s/\\/\\/.*/ /g" "${dev_container_tmp}"

          # Fetching extensions list defined in 'devcontainer.json'
          extensions="$(jq '.extensions' --compact-output "${dev_container_tmp}" | tr -d '[' | tr -d ']' | tr ',' '\n' 2>/dev/null || echo -n '')"

          # Stubbing extensions list for the tests validation with checkExtension()
          devcontainer exec --workspace-folder "src/${template_id}/" --id-label ${id_label} /bin/sh -c "\
              mkdir -p \$HOME/.vscode-server/bin \$HOME/.vscode-server/extensions \
              && cd \$HOME/.vscode-server/extensions \
              && if [ \"${extensions}\" != '' ]; then echo \"${extensions}\" | xargs -n 1 mkdir -p; fi \
              && find \$HOME/.vscode-server/ -type d"

          echo "Running Smoke Test"
          devcontainer exec --workspace-folder "src/${template_id}/" --id-label ${id_label} /bin/sh -c 'set -e && if [ -f "test-project/test.sh" ]; then cd test-project && bash test.sh; else ls -a; fi'

          # Clean up
          docker rm -f $(docker container ls -f "label=${id_label}" -q)
