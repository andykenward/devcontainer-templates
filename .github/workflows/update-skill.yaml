name: "(Update) gh agent skill"
# Keeps src/node/.claude/skills/gh/SKILL.md locked to the same gh release the
# container ships. The skill is pinned (`--pin`), so `gh skill update` would skip
# it by design — we regenerate with `gh skill install --pin` instead.
#
# Fires after a change to the node Dockerfile lands on main (Renovate bumps
# GH_VERSION there), regenerates the skill at that exact version, and opens a PR
# if the content changed. Regeneration is idempotent: when GH_VERSION is
# unchanged the pinned tree resolves to identical bytes, so no PR is opened.
on:
  push:
    branches:
      - main
    paths:
      - "src/node/.devcontainer/Dockerfile"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: "github.ref == 'refs/heads/main'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned GH_VERSION from the Dockerfile
        id: ghver
        run: |
          set -euo pipefail
          version="$(grep -oP 'ARG GH_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' \
            src/node/.devcontainer/Dockerfile)"
          if [ -z "${version}" ]; then
            echo "Could not find ARG GH_VERSION in the Dockerfile" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pinned gh version: ${version}"

      - name: Install gh at the pinned version
        # The tool generating the v$GH_VERSION skill is itself gh v$GH_VERSION,
        # so `gh skill` (added in 2.90) is guaranteed present and the emitted
        # skill matches the CLI the container ships. This is a CI helper that
        # only regenerates a reviewed markdown file, so it skips the container's
        # cosign provenance dance.
        env:
          GH_VERSION: ${{ steps.ghver.outputs.version }}
        run: |
          set -euo pipefail
          tarball="gh_${GH_VERSION}_linux_amd64.tar.gz"
          wget -nv "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${tarball}"
          tar -xzf "${tarball}"
          echo "${PWD}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Regenerate the pinned skill
        env:
          GH_VERSION: ${{ steps.ghver.outputs.version }}
          # Authenticate reads of the public cli/cli repo to avoid rate limits.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh --version
          gh skill install cli/cli gh \
            --pin "v${GH_VERSION}" \
            --dir src/node/.claude/skills \
            --force

          # Both templates ship the skill in their payload (it is deliberately
          # not baked into the image — ~/.claude is often a writable bind mount
          # that would shadow a user-scope skill). Mirror the freshly generated
          # copy so the two can never drift to different pinned gh versions.
          rm -rf src/node-image/.claude/skills/gh
          mkdir -p src/node-image/.claude/skills
          cp -R src/node/.claude/skills/gh src/node-image/.claude/skills/

      - name: Open a PR if the skill changed
        env:
          GH_VERSION: ${{ steps.ghver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # One skill copy per template, so this commits N files rather than one.
          mapfile -t files < <(git diff --name-only -- 'src/*/.claude/skills/gh/SKILL.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Skill already up to date for gh v${GH_VERSION}; nothing to do."
            exit 0
          fi
          printf 'changed: %s\n' "${files[@]}"

          branch="automated-skill-update-${GITHUB_RUN_ID}"
          message="chore: regenerate gh agent skill for gh v${GH_VERSION}"

          # Commit via the Git database API (/repos/../git/{blobs,trees,commits})
          # rather than `git push`. API commits made with GITHUB_TOKEN are signed
          # by GitHub and show as Verified, which a "require signed commits"
          # ruleset demands — a plain `git push` here produces an unsigned commit
          # and is rejected with "Commits must have verified signatures".

          base_sha="${GITHUB_SHA}"
          base_tree="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq '.tree.sha')"

          # Upload each changed file as a blob and assemble the tree entries.
          tree_entries='[]'
          for f in "${files[@]}"; do
            blob_sha="$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$(base64 -w0 "${f}")" \
              -f encoding=base64 \
              --jq '.sha')"
            tree_entries="$(jq -c --arg path "${f}" --arg sha "${blob_sha}" \
              '. += [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
              <<<"${tree_entries}")"
          done

          new_tree="$(jq -n --arg base "${base_tree}" --argjson tree "${tree_entries}" \
            '{base_tree: $base, tree: $tree}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" \
                --input - --jq '.sha')"

          new_commit="$(jq -n \
            --arg msg "${message} [skip ci]" \
            --arg tree "${new_tree}" \
            --arg parent "${base_sha}" \
            '{message: $msg, tree: $tree, parents: [$parent]}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
                --input - --jq '.sha')"

          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" \
            -f sha="${new_commit}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="${message}" \
            -f body="Regenerated the pinned \`gh\` agent skill from cli/cli@v${GH_VERSION} to match the pinned \`GH_VERSION\` in the node Dockerfile, in every template that ships it." \
            -f head="${branch}" \
            -f base='main'
