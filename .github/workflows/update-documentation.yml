name: "Update Documentation"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: "github.ref == 'refs/heads/main'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Documentation
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          generate-docs: "true"
          base-path-to-templates: "./src"

      - name: Create a PR for Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Collect the regenerated README files from the working tree.
          mapfile -t files < <(git diff --name-only | grep -E '(^|/)README\.md$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No documentation changes; nothing to do."
            exit 0
          fi

          branch="automated-documentation-update-${GITHUB_RUN_ID}"
          message="Automated documentation update"

          # Commit via the Git Data API rather than `git push`. API commits made
          # with GITHUB_TOKEN are signed by GitHub and show as Verified, which a
          # "require signed commits" ruleset demands — a plain `git push` here
          # produces an unsigned commit and is rejected with
          # "Commits must have verified signatures".

          base_sha="${GITHUB_SHA}"
          base_tree="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq '.tree.sha')"

          # Upload each changed file as a blob and assemble the tree entries.
          tree_entries='[]'
          for f in "${files[@]}"; do
            blob_sha="$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$(base64 -w0 "${f}")" \
              -f encoding=base64 \
              --jq '.sha')"
            tree_entries="$(jq -c --arg path "${f}" --arg sha "${blob_sha}" \
              '. += [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
              <<<"${tree_entries}")"
          done

          new_tree="$(jq -n --arg base "${base_tree}" --argjson tree "${tree_entries}" \
            '{base_tree: $base, tree: $tree}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" \
                --input - --jq '.sha')"

          new_commit="$(jq -n \
            --arg msg "${message} [skip ci]" \
            --arg tree "${new_tree}" \
            --arg parent "${base_sha}" \
            '{message: $msg, tree: $tree, parents: [$parent]}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
                --input - --jq '.sha')"

          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" \
            -f sha="${new_commit}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="${message}" \
            -f body="${message}" \
            -f head="${branch}" \
            -f base='main'
